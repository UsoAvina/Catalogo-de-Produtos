<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#523f31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-dark:#523f31;
    --brown-mid:#856f56;
    --tan:#b79f7b;
    --greige:#c6bdae;
    --cream:#faf6f0;
    --white:#fffdfb;
    --line: rgba(82,63,49,0.18);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--brown-dark);
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-variant-numeric:lining-nums tabular-nums;
    font-feature-settings:"lnum" 1, "tnum" 1;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond', serif;}
  button{font-family:inherit;}
  button, input, select, textarea{ font-weight:inherit; }
  img{max-width:100%;display:block;}

  /* ---------- HEADER ---------- */
  header.site-header{
    position:sticky; top:0; z-index:40;
    background:var(--cream);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 24px;
    max-width:1280px;
    margin:0 auto;
  }
  .logo{
    text-align:center;
    line-height:1;
    user-select:none;
  }
  .logo .mark{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:2.3rem;
    color:var(--brown-dark);
  }
  .logo .sub{
    display:block;
    margin-top:2px;
    font-size:0.68rem;
    letter-spacing:0.32em;
    color:var(--brown-mid);
  }
  .logo-img{
    height:48px;
    width:auto;
    display:block;
    margin:0 auto;
  }
  @media (max-width:480px){
    .logo-img{ height:38px; }
  }
  .cart-button{
    position:absolute;
    right:24px; top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:var(--brown-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px; height:42px;
    border-radius:50%;
    transition:background .2s ease;
  }
  .cart-button:hover{ background:rgba(82,63,49,0.08); }
  .cart-button svg{ width:22px; height:22px; }
  .cart-count{
    position:absolute;
    top:2px; right:2px;
    background:var(--brown-dark);
    color:var(--white);
    font-size:0.62rem;
    min-width:16px; height:16px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px;
    font-family:inherit;
  }
  .cart-count.hidden{display:none;}

  /* ---------- FILTERS ---------- */
  nav.filters{
    position:sticky; top:86px; z-index:39;
    background:var(--brown-dark);
    border-bottom:1px solid var(--brown-dark);
  }
  .filters-inner{
    max-width:1280px; margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    gap:10px;
    padding:14px 20px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters-inner::-webkit-scrollbar{display:none;}
  .filter-btn{
    background:none; border:none; cursor:pointer;
    color:rgba(255,253,251,0.62);
    font-size:1.15rem;
    font-weight:500;
    padding:9px 16px;
    border-radius:4px;
    white-space:nowrap;
    transition:color .2s ease, background-color .2s ease;
  }
  .filter-btn:hover{ color:rgba(255,253,251,0.88); }
  .filter-btn.active{
    color:var(--white);
    font-weight:600;
    background:rgba(255,253,251,0.13);
  }

  /* ---------- GRID ---------- */
  main{ max-width:1280px; margin:0 auto; padding:40px 24px 100px; }
  .section-title{
    text-align:center; margin:0 0 36px;
    font-weight:500; font-size:1.6rem; color:var(--brown-dark);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:48px 32px;
  }
  @media (max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); gap:36px 20px;} }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } nav.filters{ top:78px; } }

  .card{
    display:flex; flex-direction:column;
    background:var(--white);
    border:1px solid var(--line);
    padding:18px 18px 22px;
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .card:hover{
    box-shadow:0 6px 18px rgba(82,63,49,0.10);
    transform:translateY(-3px);
  }
  .photo-wrap{
    position:relative;
    aspect-ratio:1/1.15;
    background:var(--cream);
    overflow:hidden;
    cursor:zoom-in;
  }
  .photo-wrap img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .5s ease;
  }
  .photo-wrap:hover img{ transform:scale(1.04); }

  .dots{ display:flex; justify-content:center; gap:6px; margin-top:10px; }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--greige); border:none; cursor:pointer; padding:0;
  }
  .dot.active{ background:var(--brown-dark); }

  .card-info{ text-align:center; margin-top:14px; }
  .card-name{ font-size:1.2rem; font-weight:500; margin:0; color:var(--brown-dark); }
  .card-price, .ph-head-price, .lb-price, .price, .price-num{
    font-family: Georgia, 'Times New Roman', serif;
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings:"lnum" 1, "tnum" 1;
  }
  .card-price{ margin-top:6px; color:var(--brown-mid); font-size:1.35rem; }

  .card-actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:16px; }
  .grid-message{
    grid-column:1/-1;
    text-align:center;
    color:var(--brown-mid);
    padding:60px 10px;
    font-size:1.1rem;
  }
  .badge-soldout{
    position:absolute; top:10px; left:10px;
    background:var(--brown-dark); color:var(--white);
    font-size:0.72rem; letter-spacing:0.03em;
    padding:5px 10px;
  }
  .unavailable-label{
    color:var(--brown-mid);
    font-size:0.92rem;
    font-style:italic;
  }
  .btn{
    border:1px solid var(--brown-dark);
    padding:12px 20px;
    font-size:1rem;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, opacity .2s ease;
    background:transparent;
    color:var(--brown-dark);
  }
  .btn-solid{ background:var(--brown-dark); color:var(--white); }
  .btn-solid:hover{ background:#3f3025; }
  .btn:not(.btn-solid):hover{ background:rgba(82,63,49,0.08); }

  /* ---------- OVERLAYS (shared) ---------- */
  .overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(82,63,49,0.55);
    display:none;
    align-items:center; justify-content:center;
    padding:24px;
  }
  .overlay.open{ display:flex; }
  .close-x{
    position:absolute; top:16px; right:20px;
    background:none; border:none; cursor:pointer;
    font-size:1.6rem; line-height:1; color:inherit;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox-panel{
    background:var(--cream);
    max-width:640px; width:100%;
    max-height:92vh; overflow:auto;
    position:relative;
    padding:44px 28px 30px;
  }
  .lightbox-panel .close-x{ color:var(--brown-dark); }
  .lb-image-wrap{
    position:relative;
    aspect-ratio:1/1;
    background:var(--white);
    border:1px solid var(--line);
    overflow:hidden;
    cursor:zoom-in;
    margin:0 auto;
    max-width:420px;
  }
  .lb-image-wrap img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .25s ease;
    transform-origin:center center;
  }
  .lb-image-wrap.zoomed img{ transform:scale(2); cursor:zoom-out; }
  .lb-arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(255,253,251,0.85);
    border:1px solid var(--line);
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--brown-dark); font-size:1rem;
  }
  .lb-arrow.prev{ left:-14px; }
  .lb-arrow.next{ right:-14px; }
  .lb-image-wrap{ position:relative; }
  .lightbox-panel .lb-nav-wrap{ position:relative; max-width:420px; margin:0 auto; }

  .lb-name{ text-align:center; margin-top:20px; font-size:1.4rem; font-weight:500; }
  .lb-price{ text-align:center; color:var(--brown-mid); margin-top:4px; font-size:1.35rem; }
  .lb-actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:20px; }

  /* ---------- PURCHASE MODAL ---------- */
  .purchase-panel{
    background:var(--cream);
    max-width:460px; width:100%;
    max-height:92vh; overflow:auto;
    position:relative;
    padding:40px 30px 30px;
  }
  .purchase-panel .close-x{ color:var(--brown-dark); }
  .ph-head{ display:flex; gap:16px; align-items:center; }
  .ph-head img{ width:76px; height:76px; object-fit:cover; border:1px solid var(--line); }
  .ph-head-name{ font-size:1.25rem; font-weight:500; }
  .ph-head-price{ color:var(--brown-mid); font-size:1.35rem; margin-top:4px; }

  .field{ margin-top:24px; }
  .field label{ display:block; font-size:1.08rem; font-weight:600; letter-spacing:0.02em; color:var(--brown-dark); margin-bottom:9px; }
  .swatches{ display:flex; flex-wrap:wrap; gap:10px; }
  .swatch{
    padding:9px 16px; border:1px solid var(--line); background:var(--white);
    cursor:pointer; font-size:1rem; color:var(--brown-dark);
  }
  .swatch.selected{ border-color:var(--brown-dark); background:var(--greige); }
  select.size-select{
    width:100%; padding:12px 12px; border:1px solid var(--line);
    background:var(--white); color:var(--brown-dark); font-family:inherit; font-size:1.05rem;
  }
  .text-input{
    width:100%; padding:12px 12px; border:1px solid var(--line);
    background:var(--white); color:var(--brown-dark); font-family:inherit; font-size:1.05rem;
  }
  .text-input:focus, select.size-select:focus{ outline:1px solid var(--tan); }
  .order-summary{ margin:4px 0 22px; }
  .order-line{
    display:flex; justify-content:space-between; gap:10px;
    font-size:1.05rem; padding:9px 0; border-bottom:1px solid var(--line);
  }
  .order-line .price, .order-total-row .price{
    flex-shrink:0; white-space:nowrap; text-align:right;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  }
  .order-total-row{
    display:flex; justify-content:space-between;
    margin-top:10px; font-size:1.3rem; font-weight:600;
  }
  .form-error{
    margin-top:16px; padding:10px 12px;
    background:rgba(183,159,123,0.25);
    color:var(--brown-dark); font-size:0.98rem;
  }
  .qty-stepper{ display:flex; align-items:center; gap:14px; }
  .qty-stepper button{
    width:32px; height:32px; border:1px solid var(--line); background:var(--white);
    cursor:pointer; font-size:1rem; color:var(--brown-dark);
  }
  .qty-value{ min-width:20px; text-align:center; }

  .ph-footer{ margin-top:30px; display:flex; flex-direction:column; gap:10px; }
  .ph-footer .btn{ width:100%; }

  .confirm-view{ text-align:center; padding:20px 0; }
  .confirm-view .ico{ font-size:2.4rem; margin-bottom:10px; }

  /* ---------- CART DRAWER ---------- */
  .drawer-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(82,63,49,0.4);
    display:none;
  }
  .drawer-overlay.open{ display:block; }
  .cart-drawer{
    position:fixed; top:0; right:-400px; width:360px; max-width:88vw; height:100vh;
    background:var(--cream); z-index:101;
    display:flex; flex-direction:column;
    transition:right .35s ease;
    box-shadow:-4px 0 18px rgba(82,63,49,0.18);
  }
  .cart-drawer.open{ right:0; }
  .cart-drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 22px 16px; border-bottom:1px solid var(--line);
  }
  .cart-drawer-head h2{ font-size:1.4rem; margin:0; font-weight:500; }
  .cart-items{ flex:1; overflow-y:auto; padding:12px 22px; }
  .cart-item{
    display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--line);
  }
  .cart-item img{ width:64px; height:64px; object-fit:cover; border:1px solid var(--line); }
  .ci-name{ font-size:1rem; font-weight:500; }
  .ci-opts{ font-size:0.78rem; color:var(--brown-mid); margin-top:2px; }
  .ci-row{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .ci-qty{ display:flex; align-items:center; gap:8px; font-size:0.85rem; }
  .ci-qty button{ width:22px; height:22px; border:1px solid var(--line); background:var(--white); cursor:pointer; }
  .ci-remove{ background:none; border:none; color:var(--brown-mid); cursor:pointer; font-size:0.78rem; text-decoration:underline; }
  .cart-empty{ text-align:center; color:var(--brown-mid); padding:60px 10px; font-size:0.95rem; }

  .cart-drawer-foot{ padding:18px 22px 24px; border-top:1px solid var(--line); }
  .cart-total-row{ display:flex; justify-content:space-between; margin-bottom:14px; font-size:1.05rem; }
  .cart-drawer-foot .btn{ width:100%; margin-top:8px; }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:26px; right:26px; z-index:120;
    background:var(--brown-dark); color:var(--white);
    padding:14px 18px; display:flex; align-items:center; gap:10px;
    cursor:pointer; opacity:0; transform:translateY(12px);
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    font-size:0.88rem;
    max-width:280px;
  }
  .toast.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .toast svg{ width:18px; height:18px; flex-shrink:0; }

  @media (max-width:480px){
    .logo .mark{ font-size:1.9rem; }
    .cart-drawer{ width:100vw; max-width:100vw; }
  }
</style>
</head>

<script>
/* ============ DADOS ============ */
const CATEGORIES = [
  { key:'geral', label:'Geral' },
  { key:'brinco', label:'Brinco' },
  { key:'colar', label:'Colar' },
  { key:'choker', label:'Choker' },
  { key:'pulseira', label:'Pulseiras e braceletes' },
  { key:'anel', label:'Anel' },
  { key:'conjunto', label:'Conjuntos' },
];

const FINISHES = ['Dourado','Prata','Ouro Rosé'];
const FINISH_ACCENT = { 'Dourado':'#b79f7b', 'Prata':'#c6bdae', 'Ouro Rosé':'#a9806f' };

const WHATSAPP_NUMBER = '5531990820145';
const PAYMENT_METHODS = ['Pix', 'Cartão de Crédito', 'Cartão de Débito', 'Dinheiro'];
const DELIVERY_METHODS = [
  { key:'retirada', label:'Retirar no Local' },
  { key:'app99', label:'Entregar via aplicativo 99' },
];

function money(v){ return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function formatPhone(value){
  const digits = value.replace(/\D/g, '').slice(0, 11);
  const len = digits.length;
  if (len === 0) return '';
  if (len <= 2) return `(${digits}`;
  if (len <= 6) return `(${digits.slice(0,2)}) ${digits.slice(2)}`;
  if (len <= 10) return `(${digits.slice(0,2)}) ${digits.slice(2,6)}-${digits.slice(6)}`;
  return `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
}

/* gera SVG placeholder para cada categoria/variante, usado como "foto" do produto */
function productSVG(category, variantIndex){
  const accent = FINISH_ACCENT[FINISHES[variantIndex % FINISHES.length]];
  const bg1 = '#faf6f0', bg2 = '#c6bdae';
  const rot = variantIndex * 6 - 6;
  const stroke = '#523f31';

  let icon = '';
  switch(category){
    case 'brinco':
      icon = `<g transform="rotate(${rot} 100 120)">
        <circle cx="100" cy="70" r="20" fill="none" stroke="${stroke}" stroke-width="2.5"/>
        <path d="M92 88 C 92 115, 108 115, 108 88" fill="none" stroke="${stroke}" stroke-width="2.5"/>
        <circle cx="100" cy="128" r="9" fill="${accent}" stroke="${stroke}" stroke-width="1.5"/>
      </g>`;
      break;
    case 'colar':
      icon = `<g transform="rotate(${rot} 100 120)">
        <path d="M55 55 Q100 130 145 55" fill="none" stroke="${stroke}" stroke-width="2.5"/>
        <path d="M90 118 L100 140 L110 118 Z" fill="${accent}" stroke="${stroke}" stroke-width="1.5"/>
      </g>`;
      break;
    case 'choker':
      icon = `<g transform="rotate(${rot} 100 110)">
        <path d="M60 75 Q100 105 140 75" fill="none" stroke="${stroke}" stroke-width="2.5"/>
        <circle cx="100" cy="98" r="8" fill="${accent}" stroke="${stroke}" stroke-width="1.5"/>
      </g>`;
      break;
    case 'pulseira':
      icon = `<g transform="rotate(${rot} 100 120)">
        <circle cx="100" cy="120" r="45" fill="none" stroke="${stroke}" stroke-width="4"/>
        <circle cx="100" cy="75" r="6" fill="${accent}" stroke="${stroke}" stroke-width="1.2"/>
        <circle cx="145" cy="120" r="6" fill="${accent}" stroke="${stroke}" stroke-width="1.2"/>
        <circle cx="55" cy="120" r="6" fill="${accent}" stroke="${stroke}" stroke-width="1.2"/>
      </g>`;
      break;
    case 'anel':
      icon = `<g transform="rotate(${rot} 100 120)">
        <ellipse cx="100" cy="145" rx="30" ry="16" fill="none" stroke="${stroke}" stroke-width="3.5"/>
        <ellipse cx="100" cy="105" rx="14" ry="11" fill="${accent}" stroke="${stroke}" stroke-width="2"/>
      </g>`;
      break;
    case 'conjunto':
      icon = `<g transform="rotate(${rot} 100 120)">
        <path d="M62 60 Q100 118 138 60" fill="none" stroke="${stroke}" stroke-width="2.2"/>
        <path d="M92 105 L100 122 L108 105 Z" fill="${accent}" stroke="${stroke}" stroke-width="1.3"/>
        <circle cx="55" cy="150" r="10" fill="none" stroke="${stroke}" stroke-width="2"/>
        <circle cx="55" cy="165" r="5" fill="${accent}" stroke="${stroke}" stroke-width="1"/>
        <circle cx="145" cy="150" r="10" fill="none" stroke="${stroke}" stroke-width="2"/>
        <circle cx="145" cy="165" r="5" fill="${accent}" stroke="${stroke}" stroke-width="1"/>
      </g>`;
      break;
  }

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
    <defs>
      <linearGradient id="g${category}${variantIndex}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${bg1}"/>
        <stop offset="1" stop-color="${bg2}"/>
      </linearGradient>
    </defs>
    <rect width="200" height="240" fill="url(#g${category}${variantIndex})"/>
    ${icon}
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* ============ SISTEMA DE PRODUTOS POR TAG (CSV + FOTOS) ============
   Como atualizar o catálogo (sem mexer no código):
   1) Dê a cada produto uma TAG única no formato PREFIXO-000, ex: COL-001.
      Prefixos por categoria: BRI=Brinco, COL=Colar, CHK=Choker,
      PUL=Pulseiras e braceletes, ANE=Anel, CJT=Conjuntos.
   2) Salve as fotos do produto na pasta "fotos/" nomeadas como
      TAG-1.jpg, TAG-2.jpg, TAG-3.jpg... (aceita .jpg, .jpeg, .png, .webp).
      Pode ter 1 até 8 fotos por produto, o site descobre sozinho.
   3) Edite o arquivo "produtos.csv" (abre no Excel/Google Sheets) e
      adicione uma linha por produto com as colunas:
      tag;nome;preco;disponivel;acabamentos;tamanhos
      - preco: use ponto decimal, ex: 129.90
      - disponivel: sim ou nao
      - acabamentos: lista separada por vírgula, ex: Dourado,Prata,Ouro Rosé
      - tamanhos: lista separada por vírgula (deixe vazio se não se aplica)
   4) Publique o repositório no GitHub Pages. Importante: como o site
      busca o produtos.csv e as fotos via fetch, isso só funciona quando
      o site é servido por um endereço http/https (GitHub Pages já faz
      isso). Abrindo o arquivo direto no navegador (file://) o navegador
      bloqueia essa busca — enquanto isso, o catálogo de exemplo abaixo
      é exibido como substituto, só para não ficar em branco.
*/

function checkImageExists(url){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function findPhotoForIndex(tag, index){
  for (const ext of IMAGE_EXTENSIONS){
    const url = `${PHOTOS_FOLDER}${tag}-${index}.${ext}`;
    const ok = await checkImageExists(url);
    if (ok) return url;
  }
  return null;
}

async function discoverImages(tag, category){
  const found = [];
  for (let i = 1; i <= MAX_PHOTOS_PER_PRODUCT; i++){
    const url = await findPhotoForIndex(tag, i);
    if (!url) break;
    found.push(url);
  }
  if (found.length === 0){
    // nenhuma foto real encontrada ainda: mostra uma ilustração provisória
    return [productSVG(category, 0), productSVG(category, 1), productSVG(category, 2)];
  }
  return found;
}

function parseList(value){
  return (value || '').split(',').map(s => s.trim()).filter(Boolean);
}

function isAvailableValue(value){
  const v = (value || 'sim').trim().toLowerCase();
  return v !== 'nao' && v !== 'não' && v !== 'n' && v !== '0' && v !== 'false';
}

function parseCSV(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length === 0) return [];
  const header = lines[0].split(';').map(h => h.trim().toLowerCase());
  return lines.slice(1).map(line => {
    const cols = line.split(';');
    const row = {};
    header.forEach((key, i) => { row[key] = (cols[i] || '').trim(); });
    return row;
  });
}

async function buildProductFromRow(row, index){
  const tag = (row.tag || '').toUpperCase().trim();
  const prefix = tag.split('-')[0];
  const category = CATEGORY_BY_PREFIX[prefix] || 'outro';
  const sizeOptions = parseList(row.tamanhos);
  const finishes = parseList(row.acabamentos);

  return {
    id: index + 1,
    tag,
    category,
    name: row.nome || tag,
    price: parseFloat(String(row.preco || '0').replace(',', '.')) || 0,
    available: isAvailableValue(row.disponivel),
    finishes: finishes.length ? finishes : FINISHES,
    hasSize: sizeOptions.length > 0,
    sizeLabel: category === 'anel' ? 'Numeração' : 'Tamanho',
    sizeOptions,
    images: await discoverImages(tag, category),
  };
}

async function loadProducts(){
  let rows = FALLBACK_ROWS;
  let usedFallback = true;
  try {
    const res = await fetch(CSV_FILE, { cache: 'no-store' });
    if (!res.ok) throw new Error('produtos.csv não encontrado (status ' + res.status + ')');
    const text = await res.text();
    const parsed = parseCSV(text);
    if (parsed.length > 0){
      rows = parsed;
      usedFallback = false;
    }
  } catch (err){
    console.warn('Usando catálogo de exemplo — produtos.csv não pôde ser lido:', err.message);
  }
  if (usedFallback){
    console.info('Dica: publique o site em um servidor (ex: GitHub Pages) para que o produtos.csv seja carregado de verdade.');
  }
  return Promise.all(rows.map((row, i) => buildProductFromRow(row, i)));
}

function openCheckoutFromCart(){
  if (cart.length === 0) return;
  const order = cart.map(item => {
    const prod = PRODUCTS.find(p => p.id === item.productId);
    return {
      name:item.name, finish:item.finish, size:item.size,
      sizeLabel: prod ? prod.sizeLabel : 'Tamanho',
      qty:item.qty, price:item.price,
    };
  });
  purchaseState = {
    stage:'final', mode:'cartcheckout', product:null,
    order,
    customer:{ nome:'', pagamento:PAYMENT_METHODS[0], entrega:'retirada', celular:'', endereco:'' },
    error:'',
  };
  closeOverlay('drawer');
  renderPurchase();
  purchaseOverlay.classList.add('open');
}

function renderPurchase(){
  if (purchaseState.stage === 'options') return renderPurchaseOptions();
  if (purchaseState.stage === 'final') return renderPurchaseFinal();
  if (purchaseState.stage === 'done') return renderPurchaseDone();
}

    lines.push(`- ${item.qty}x *${item.name}*${opts ? ' (' + opts + ')' : ''} — ${money(item.price * item.qty)}`);

function addToCartInternal(product, finish, size, qty){
  const existing = cart.find(i => i.productId === product.id && i.finish === finish && i.size === size);
  if (existing){
    existing.qty += qty;
  } else {
    cart.push({
      productId: product.id,
      name: product.name,
      price: product.price,
      finish, size, qty,
      image: product.images[0],
    });
  }
  updateCartCount();
  renderCartDrawer();
}

function updateCartCount(){
  const total = cart.reduce((s, i) => s + i.qty, 0);
  const el = document.getElementById('cartCount');
  el.textContent = total;
  el.classList.toggle('hidden', total === 0);
}

  document.getElementById('cartContinueBtn').addEventListener('click', () => closeOverlay('drawer'));
}

cartItemsWrap.addEventListener('click', (e) => {
  const inc = e.target.closest('[data-inc]');
  const dec = e.target.closest('[data-dec]');
  const rem = e.target.closest('[data-remove]');
  if (inc){ cart[Number(inc.dataset.inc)].qty += 1; updateCartCount(); renderCartDrawer(); }
  if (dec){
    const i = Number(dec.dataset.dec);
    cart[i].qty -= 1;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    updateCartCount(); renderCartDrawer();
  }
  if (rem){ cart.splice(Number(rem.dataset.remove), 1); updateCartCount(); renderCartDrawer(); }
});

document.getElementById('cartButton').addEventListener('click', () => openDrawer());

function openDrawer(){
  renderCartDrawer();
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
}

/* ============ TOAST ============ */
let toastTimer = null;
function showToast(){
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4500);
}
document.getElementById('toast').addEventListener('click', () => {
  document.getElementById('toast').classList.remove('show');
  openDrawer();
});

/* ============ FECHAR OVERLAYS ============ */
function closeOverlay(which){
  if (which === 'lightbox') document.getElementById('lightboxOverlay').classList.remove('open');
  if (which === 'purchase') document.getElementById('purchaseOverlay').classList.remove('open');
  if (which === 'drawer'){
    document.getElementById('drawerOverlay').classList.remove('open');
    document.getElementById('cartDrawer').classList.remove('open');
  }
}

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeOverlay(btn.dataset.close));
});
document.getElementById('lightboxOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'lightboxOverlay') closeOverlay('lightbox');
});
document.getElementById('purchaseOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'purchaseOverlay') closeOverlay('purchase');
});
document.getElementById('drawerOverlay').addEventListener('click', () => closeOverlay('drawer'));

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    closeOverlay('lightbox');
    closeOverlay('purchase');
    closeOverlay('drawer');
  }
});
</script>
</body>
</html>
